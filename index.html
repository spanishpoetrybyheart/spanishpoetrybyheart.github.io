<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spanish Poetry by Heart</title>
  <style>
    :root {
      --primary-color: #0066cc;
      --primary-hover: #004999;
      --secondary-color: #f4f4f5;
      --secondary-hover: #e4e4e7;
      --text-main: #18181b;
      --text-muted: #52525b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      text-align: center;
    }

    header {
      max-width: 650px;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      font-size: 1.125rem;
      color: var(--text-muted);
      font-style: italic;
      line-height: 1.5;
    }

    .cover-container {
      margin: 1.5rem 0 2rem 0;
    }

    .book-cover {
      max-width: 260px;
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .book-cover:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.2), 0 10px 12px -5px rgba(0, 0, 0, 0.12);
    }

    .cta-container {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 3rem;
    }

    .btn {
      display: inline-block;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--secondary-color);
      color: var(--text-main);
      border: 1px solid #d4d4d8;
    }

    .btn-secondary:hover {
      background-color: var(--secondary-hover);
    }

    footer {
      font-size: 0.875rem;
      color: var(--text-muted);
      border-top: 1px solid #e4e4e7;
      padding-top: 1.5rem;
      width: 100%;
      max-width: 500px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Spanish Poetry by Heart</h1>
    <p class="subtitle">Learn and memorize classic Spanish poetry through audio and structured text.</p>
  </header>

  <!-- Portada del libro (preparada para enlazar a Amazon u otra tienda en el futuro) -->
  <div class="cover-container">
    <a href="#" id="book-link" title="Spanish Poetry by Heart">
      <img src="portada_kdp_front.jpg" alt="Spanish Poetry by Heart Cover" class="book-cover">
    </a>
  </div>

  <!-- Botones de descarga / reproducción local -->
  <div class="cta-container">
    <a href="spanish_poetry_by_heart_excerpt.pdf" class="btn btn-primary" target="_blank">Download Free Sample (PDF)</a>
    <a href="spanish_poetry_by_heart_audio_full.mp3" class="btn btn-secondary" target="_blank">Listen to Audio Samples</a>
  </div>

  <footer>
    &copy; Spanish Poetry by Heart. All rights reserved.
  </footer>

</body>
</html>
