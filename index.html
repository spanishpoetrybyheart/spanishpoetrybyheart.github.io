<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Poetry by Heart</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
            line-height: 1.6;
            color: #333;
        }
        header {
            text-align: center;
            padding-bottom: 2rem;
            border-bottom: 1px solid #eee;
        }
        h1 {
            color: #111;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #666;
            font-style: italic;
        }
        .cta-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 2rem 0;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background-color: #0066cc;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn-secondary {
            background-color: #f4f4f4;
            color: #333;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <header>
        <h1>Spanish Poetry by Heart</h1>
        <p class="subtitle">Learn and memorize classic Spanish poetry through audio and structured text.</p>
    </header>

    <main>
        <div class="cta-buttons">
            <a href="#" class="btn">Download Free Sample (PDF)</a>
            <a href="#" class="btn btn-secondary">Listen to Audio Samples</a>
        </div>
    </main>
</body>
</html>
