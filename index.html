<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
      initial-scale=1.0">
    <title>Spanish Poetry by Heart</title>
    <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary-color: #27272a;
      --secondary-hover: #3f3f46;
      --bg-color: #0f172a; /* Fondo azul noche elegante */
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      text-align: center;
    }

    header {
      max-width: 650px;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    p.subtitle {
      font-size: 1.125rem;
      color: var(--text-muted);
      font-style: italic;
      line-height: 1.5;
    }

    .cover-container {
      margin: 1.5rem 0 2.5rem 0;
    }

    .book-cover {
      max-width: 350px;
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.5), 0 10px 15px -5px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .book-cover:hover {
      transform: translateY(-4px);
      box-shadow: 0 25px 45px -5px rgba(0, 0, 0, 0.6), 0 12px 20px -5px rgba(0, 0, 0, 0.4);
    }

    .cta-container {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 3rem;
    }

    .btn {
      display: inline-block;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: #ffffff;
      box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.39);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--secondary-color);
      color: #f4f4f5;
      border: 1px solid #3f3f46;
    }

    .btn-secondary:hover {
      background-color: var(--secondary-hover);
    }

    footer {
      font-size: 0.875rem;
      color: var(--text-muted);
      border-top: 1px solid #1e293b;
      padding-top: 1.5rem;
      width: 100%;
      max-width: 500px;
    }
  </style>
  </head>
  <body>
    <header>
      <h1>Spanish Poetry by Heart</h1>
      <p class="subtitle">Learn and memorize classic Spanish poetry
        through audio and structured text.</p>
    </header>
    <div class="cover-container"> <a href="#" id="book-link"
        title="Spanish Poetry by Heart"> <img
          src="portada_kdp_front.jpg" alt="Spanish Poetry by Heart
          Cover" class="book-cover"> </a> </div>
    <div class="cta-container"> <a
        href="spanish_poetry_by_heart_excerpt.pdf" class="btn
        btn-primary" target="_blank">Download Free Sample (PDF)</a> <a
        href="spanish_poetry_by_heart_audio_full.mp3" class="btn
        btn-secondary" target="_blank">Listen to Audio Samples</a> </div>
    <footer> © Spanish Poetry by Heart. All rights reserved. </footer>
  </body>
</html>
